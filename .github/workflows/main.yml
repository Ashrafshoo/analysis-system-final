
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Employee Analysis App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find or extract Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find . \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project found. Searching ZIP files..."

            mkdir -p /tmp/android-project

            while IFS= read -r ZIP_FILE; do
              echo "Extracting: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d /tmp/android-project
            done < <(find . -maxdepth 4 -type f -iname '*.zip')

            PROJECT_DIR=$(find /tmp/android-project \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle project found. Check repository contents."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project at: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::The app Gradle file is missing."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          cd "$ANDROID_PROJECT_DIR"
          find app/build/outputs/apk -type f -name '*.apk'
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: employee-analysis-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
